hostname r1
!
ip domain name lab.local
!
username admin privilege 15 secret <pw>
enable secret <pw>
!
crypto key generate rsa modulus 2048
!
ip ssh version 2
ip ssh time-out 60
!
interface GigabitEthernet0/0
 description MGMT
 ip address dhcp
 no shutdown
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
line con 0
 logging synchronous
 exec-timeout 0 0
 length 0
!
line vty 0 4
 transport input ssh
 login local
 exec-timeout 0 0
 length 0
!
no ip domain-lookup
!
end