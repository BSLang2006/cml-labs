hostname sw2

no service config

ip domain name lab.local
username admin privilege 15 secret homepass
ip ssh version 2
no ip domain-lookup

vtp mode transparent

vlan 99
 name MGMT

interface g0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 99
 no shutdown 

interface vlan 99
 ip address 10.10.99.102 255.255.255.0
 no shutdown

line vty 0 15
 transport input ssh
 login local
 length 0 

line con 0
 logging synchronous
 exec-timeout 0 0
 length 0
end