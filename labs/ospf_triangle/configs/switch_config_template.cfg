hostname sw0
!
no service config
!
ip domain name lab.local
username admin privilege 15 secret <pw>
enable secret <pw>
ip ssh version 2
no ip domain-lookup
!
interface vlan 1
 ip address dhcp
 no shutdown
!
line vty 0 15
 transport input ssh
 login local
 length 0 
!
line con 0
 logging synchronous
 exec-timeout 0 0
 length 0
end